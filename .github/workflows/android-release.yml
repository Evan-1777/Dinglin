name: Android Release

# 手动触发：构建签名 release APK 并发布 GitHub Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v1.0.0）'
        required: true
        type: string
      prerelease:
        description: '标记为预发布'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Signed APK & Publish Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - name: Inject Optional google-services.json
        working-directory: .
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "$ANDROID_GOOGLE_SERVICES_JSON" | base64 -d > client/android/app/google-services.json
          fi

      - name: Prepare Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret，无法生成签名包"
            exit 1
          fi
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/dinglin-release.p12
          cat > android/key.properties <<EOF
          storeType=PKCS12
          storeFile=keystore/dinglin-release.p12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          flutter build apk --release --build-name="$VERSION" --build-number="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "dinglin-${TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dinglin-android-apk-${{ inputs.tag }}
          path: client/dinglin-${{ inputs.tag }}.apk

      - name: Publish GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          gh release create "$TAG" "client/dinglin-${TAG}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Dinglin $TAG" \
            --generate-notes \
            $([ "$PRERELEASE" = "true" ] && echo "--prerelease")
