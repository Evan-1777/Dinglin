name: Dinglin CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  server-ci:
    name: Go Server Vet, Test & Static Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Vet
        run: go vet ./...
      - name: Race Tests
        run: go test -race -count=1 ./...
      - name: Build Static Linux Binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dinglin-linux-amd64 ./cmd/dinglin
      - uses: actions/upload-artifact@v4
        with:
          name: dinglin-server-linux-amd64
          path: server/dinglin-linux-amd64

  client-web-ci:
    name: Flutter Analyze, Test & Web Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit & Widget Tests
        run: flutter test
      - name: Build Web Release
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: dinglin-web-dist
          path: client/build/web

  client-android-ci:
    name: Flutter Android APK Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Inject Optional google-services.json
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "$ANDROID_GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          fi
      - name: Dependencies
        run: flutter pub get
      - name: Build Release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: dinglin-android-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk
